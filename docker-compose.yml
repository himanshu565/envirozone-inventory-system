services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: envirostore
      POSTGRES_PASSWORD: envirostore
      POSTGRES_DB: envirostore
    ports:
      - "5432:5432"
    volumes:
      - envirostore_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  envirostore_pgdata:
